<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store</title>
    <style>
        .header{
            background: rgb(52, 105, 139);
            height: 80px;
            font-size: 30px;
            display: flex;
            align-items:center;
            text-align:center;
            border: 1px solid black;

        }
        .logo{
            width: 120px;
            
        }
        .logo img{
            width:120px;
            height: 70px;
        }
        .title{
            font-weight: bold;
            flex:1;
        }
        .menu{
            background: rgb(116, 173, 187);
            display: flex;
            height: 50px;
            justify-content: space-around;
            align-items: center;

            
        }
        .menu a{
            text-decoration:none;
            color:black;
            font-weight:bold;
        }
        .main{
            display: flex;
            height: 200px;
        }
        .left{
            width: 120px;
            border: 1px solid black;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .left a{
            text-decoration: none;
            color: black;
        }
        .right{
            flex: 1;
            border: 1px solid black;
            text-align: center;
            align-items: center;
            padding: 20px;
        }
        .right iframe{
            width:100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="glb_logo.jpg" alt="gl bajaj logo">
        </div>
        <div class="title">
            Online Book Store
        </div>
    </div>
    <div class="menu">
        <a href="home.html" target="content">Home</a>
        <a href="">Login</a>
        <a href="">Registration</a>
        <a href="">Catalogue</a>
        <a href="">Cart</a>

    </div>
    <div class="main">
        <div class="left">
            <a href="cse.html" target="content">CSE</a>
            <a href="ece.html" target="content">ECE</a>
            <a href="eee.html" target="content">EEE</a>
            <a href="civil.html" target="content">CIVIL</a>
        </div>
        <div class="right">
            <iframe src="home.html" frameborder="0" name="content"></iframe>
        </div>
    </div>
</body>
</html>
